<section class="relative flex min-h-screen items-center overflow-hidden pt-24" aria-label="Introduction">
  <div class="hero-glow hero-glow-1" aria-hidden="true"></div>
  <div class="hero-glow hero-glow-2" aria-hidden="true"></div>
  <div class="hero-grid" aria-hidden="true"></div>

  <div class="relative z-10 mx-auto w-full max-w-6xl px-6 lg:px-8">
    <div class="grid items-center gap-12 lg:grid-cols-2 lg:gap-16">
      <div class="order-2 lg:order-1">
        <p class="animate-fade-up mb-4 inline-flex items-center gap-2 rounded-full border border-sky-500/20 bg-sky-500/10 px-4 py-1.5 text-sm text-sky-300">
          <span class="relative flex h-2 w-2">
            <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-sky-400 opacity-75"></span>
            <span class="relative inline-flex h-2 w-2 rounded-full bg-sky-400"></span>
          </span>
          Available for opportunities
        </p>

        <h1 class="animate-fade-up animation-delay-100 text-4xl font-bold leading-tight tracking-tight text-white sm:text-5xl lg:text-6xl">
          Hi, I'm
          <span class="bg-gradient-to-r from-sky-400 via-cyan-300 to-indigo-400 bg-clip-text text-transparent">
            {{ data.shortName }}
          </span>
        </h1>

        <p class="animate-fade-up animation-delay-200 mt-2 text-xl font-medium text-zinc-300 sm:text-2xl">
          {{ data.title }} · {{ data.subtitle }}
        </p>

        <p class="animate-fade-up animation-delay-300 mt-6 max-w-xl text-lg leading-relaxed text-zinc-400">
          {{ data.tagline }}
        </p>

        <div class="animate-fade-up animation-delay-400 mt-8 flex flex-wrap items-center gap-4">
          <a
            href="#projects"
            class="inline-flex items-center gap-2 rounded-xl bg-gradient-to-r from-sky-500 to-indigo-500 px-6 py-3 text-sm font-semibold text-white shadow-xl shadow-sky-500/25 transition-transform hover:scale-[1.02]"
          >
            View My Work
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
            </svg>
          </a>
          <a
            [href]="data.resumeUrl"
            target="_blank"
            rel="noopener"
            class="inline-flex items-center gap-2 rounded-xl border border-white/10 bg-white/5 px-6 py-3 text-sm font-semibold text-zinc-200 backdrop-blur-sm transition-colors hover:border-white/20 hover:bg-white/10"
          >
            Download Resume
          </a>
        </div>

        <div class="animate-fade-up animation-delay-500 mt-12 flex flex-wrap gap-6 text-sm text-zinc-500">
          <span class="flex items-center gap-2">
            <svg class="h-4 w-4 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            {{ data.location }}
          </span>
          <span class="flex items-center gap-2">
            <svg class="h-4 w-4 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            Technovez
          </span>
        </div>
      </div>

      <div class="animate-fade-up animation-delay-200 order-1 flex justify-center lg:order-2 lg:justify-end">
        <div class="profile-frame">
          <div class="profile-frame-inner">
            <img
              [src]="data.profileImageUrl"
              [alt]="data.name + ' — professional headshot'"
              class="profile-image"
              width="400"
              height="500"
              fetchpriority="high"
            />
          </div>
          <div class="profile-accent profile-accent-1" aria-hidden="true"></div>
          <div class="profile-accent profile-accent-2" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <div class="animate-fade-up animation-delay-600 absolute bottom-12 left-1/2 hidden -translate-x-1/2 lg:block">
      <a href="#about" class="flex flex-col items-center gap-2 text-zinc-500 transition-colors hover:text-zinc-300" aria-label="Scroll to about section">
        <span class="text-xs uppercase tracking-widest">Scroll</span>
        <svg class="h-5 w-5 animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
        </svg>
      </a>
    </div>
  </div>
</section>
