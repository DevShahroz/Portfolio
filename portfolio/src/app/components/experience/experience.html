<section id="experience" class="section-padding">
  <div class="mx-auto max-w-6xl px-6 lg:px-8">
    <div class="section-header">
      <span class="section-label">Experience</span>
      <h2 class="section-title">Where I've worked</h2>
    </div>

    <div class="relative mt-12">
      <div class="absolute left-4 top-0 hidden h-full w-px bg-gradient-to-b from-sky-500/50 via-indigo-500/30 to-transparent md:left-8 md:block" aria-hidden="true"></div>

      <div class="space-y-8">
        @for (job of data.experience; track job.role; let first = $first) {
          <article class="relative md:pl-20">
            <div
              class="absolute left-2.5 top-6 hidden h-3 w-3 rounded-full border-2 border-sky-400 bg-zinc-950 md:left-[1.625rem] md:block"
              [class.ring-4]="first"
              [class.ring-sky-500/20]="first"
              aria-hidden="true"
            ></div>

            <div class="glass-card p-6 md:p-8">
              <div class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
                <div>
                  <h3 class="text-xl font-semibold text-white">{{ job.role }}</h3>
                  <p class="mt-1 text-sky-400">{{ job.company }} · {{ job.location }}</p>
                </div>
                <span class="inline-flex w-fit rounded-full border border-white/10 bg-white/5 px-3 py-1 text-sm text-zinc-400">
                  {{ job.period }}
                </span>
              </div>
              <ul class="mt-5 space-y-2">
                @for (item of job.highlights; track item) {
                  <li class="flex gap-3 text-zinc-400">
                    <svg class="mt-1 h-4 w-4 shrink-0 text-sky-500" fill="currentColor" viewBox="0 0 20 20">
                      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                    </svg>
                    <span>{{ item }}</span>
                  </li>
                }
              </ul>
            </div>
          </article>
        }
      </div>
    </div>
  </div>
</section>
